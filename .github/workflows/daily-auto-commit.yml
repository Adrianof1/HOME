name: Daily Auto Commit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-auto-commit.yml'

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README timestamp
        run: |
          STAMP="_Última atualização: $(date -u +'%Y-%m-%d %H:%M:%S UTC')_"
          awk -v stamp="$STAMP" '
            /<!-- LAST-UPDATE:START -->/ { print; print "### 🔄 Última atualização automática"; print stamp; skip=1; next }
            /<!-- LAST-UPDATE:END -->/ { skip=0 }
            !skip { print }
          ' README.md > README.md.tmp && mv README.md.tmp README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualização diária automática ($(date -u +'%Y-%m-%d'))"
            git push
          fi
